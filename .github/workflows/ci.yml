name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Gateway + app test suites
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit (critical gate; prod runtime)
        # Critical must be zero. Remaining high/moderate are the dev-only
        # vite/esbuild chain, pending a deliberate vite major upgrade (tracked
        # in docs/PR52_MERGE_BLOCKERS.md, Q6). They are not shipped at runtime.
        run: npm audit --omit=dev --audit-level=critical
