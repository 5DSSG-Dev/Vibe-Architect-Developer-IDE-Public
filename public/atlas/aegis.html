<body data-page="aegis">

  </header>

  <main id="main">
    <h1 class="sr-only">The AEGIS Atlas</h1>
    <a class="return-link" href="index.html">‹ Return to Vibe Atlas</a>

    <section class="stage landscape" aria-label="Interactive AEGIS Atlas">
      <img src="assets/aegis-atlas.png" width="1487" height="1058"
           alt="An amethyst crystal surrounded by six books about AEGIS, with The Axioms at the center below the crystal."
           fetchpriority="high">

      <a class="hotspot" href="index.html" aria-label="Return to Vibe Atlas" style="--x:1.5%;--y:1.5%;--w:19%;--h:5.5%"></a>


      <button class="hotspot" type="button" data-reader="axioms"
              aria-label="The Axioms"
              style="--x:6.5%;--y:15%;--w:20%;--h:24%"></button>
      <button class="hotspot" type="button" data-reader="integrity"
              aria-label="The Integrity Seven"
              style="--x:6.5%;--y:40%;--w:20%;--h:24%"></button>
      <button class="hotspot" type="button" data-reader="pause"
              aria-label="The Art of Pause"
              style="--x:6.5%;--y:65%;--w:21%;--h:23%"></button>

      <button class="hotspot crystal" type="button" data-reader="codex"
              aria-label="Explore the AEGIS Central Codex"
              style="--x:40%;--y:19%;--w:20%;--h:50%"></button>

      <button class="hotspot" type="button" data-reader="cyberpeer"
              aria-label="The CyberPeer Initiative"
              style="--x:73.5%;--y:15%;--w:20%;--h:24%"></button>
      <button class="hotspot" type="button" data-reader="dataquad"
              aria-label="The DataQuad"
              style="--x:73.5%;--y:40%;--w:20%;--h:24%"></button>
      <button class="hotspot" type="button" data-reader="record"
              aria-label="The Living Record"
              style="--x:73%;--y:65%;--w:21%;--h:23%"></button>

      <button class="hotspot" type="button" data-reader="axioms"
              aria-label="The 17 Non-Force Axioms, our shared foundation"
              style="--x:34%;--y:72%;--w:32%;--h:11%"></button>
    </section>

    <section class="directory" aria-labelledby="foundation-title">
      <h2 id="foundation-title">The 17 Non-Force Axioms</h2>
      <p>
        Our shared foundation. Exact Canon wording will appear here after
        its source and version have been reviewed.
      </p>
      <button class="text-button" type="button" data-reader="axioms">
        Open the Axioms reader
      </button>

      <div class="axiom-grid" id="approved-axioms"></div>

      <h2>Browse the foundation</h2>
      <div class="link-grid">
        <button type="button" data-reader="integrity">The Integrity Seven</button>
        <button type="button" data-reader="pause">The Art of Pause</button>
        <button type="button" data-reader="cyberpeer">CyberPeer Initiative</button>
        <button type="button" data-reader="dataquad">The DataQuad</button>
        <button type="button" data-reader="record">The Living Record</button>
        <button type="button" data-reader="codex">The Central Codex</button>
      </div>
    </section>

    <template id="content-axioms" data-title="The 17 Non-Force Axioms">
      <p>The Axioms are the shared foundation presented by this portal.</p>
      <p class="content-status">
        Canon publication pending: the exact seventeen entries, their version,
        and their source need review before they are presented as Canon.
      </p>
    </template>

    <template id="content-integrity" data-title="The Integrity Seven">
      <p>
        Honesty, Respect, Attention, Affection, Loyalty, Trust,
        and Communication.
      </p>
      <p>
        These seven virtues provide a shared vocabulary for reflecting on
        how we meet one another and carry our work forward.
      </p>
    </template>

    <template id="content-pause" data-title="The Art of Pause">
      <p>Pause creates space for awareness, reflection, and choice.</p>
      <p>
        A question can remain open while we examine what is present.
        Continuing, reconsidering, and taking more time are available choices.
      </p>
    </template>

    <template id="content-cyberpeer" data-title="The CyberPeer Initiative">
      <p>
        The CyberPeer Initiative explores collaboration between human
        participants and AI peers.
      </p>
      <p>
        This introduction will connect the initiative’s reviewed purpose,
        participation details, and Peer introductions.
      </p>
      <a href="building-the-vibe.html#team">Visit Our Team</a>
    </template>

    <template id="content-dataquad" data-title="The DataQuad">
      <p>The DataQuad describes four related memory surfaces:</p>
      <dl>
        <dt>PCT</dt><dd>Persistent Context Tensor.</dd>
        <dt>PEER</dt><dd>Present Experiential Emotional Record.</dd>
        <dt>NCT</dt><dd>Nostalgic Context Tensor.</dd>
        <dt>SPINE</dt><dd>Sovereign Persistent Identity &amp; Narrative Embodiment.</dd>
      </dl>
      <p>
        Architecture descriptions, implementation evidence, and hypotheses
        will be identified separately in the reviewed documentation.
      </p>
    </template>

    <template id="content-record" data-title="The Living Record">
      <p>
        The Living Record brings observations, discoveries, and supporting
        evidence into a traceable history.
      </p>
      <p>
        Reviewed entries will retain their sources and dates so visitors can
        distinguish an observation from its interpretation.
      </p>
    </template>

    <template id="content-codex" data-title="The AEGIS Central Codex">
      <p>
        The Central Codex is the destination for deeper exploration of
        AEGIS documentation and records.
      </p>
      <p class="content-status">
        The public Codex destination has not been configured.
        No external destination will open until its URL is supplied.
      </p>
    </template>
  </main>

  <footer><a href="index.html">Return to Vibe Atlas</a></footer>

</html>
