    <template id="content-compass" data-title="Your Compass">
      <p class="atlas-summary">Getting your bearings in Vibe Architect, and always finding your way back.</p>
      <h3>Introduction</h3>
      <p>Vibe Architect is an Adaptive Relational IDE — a place you inhabit, not a dashboard you operate. Its first principle is simple: <strong>Environment is Everything.</strong> What you see around you <em>is</em> the system, arranged so you can find your way by looking rather than by memorizing. You are meant to wander, open things out of curiosity, and come back without starting over.</p>
      <h3>The three rooms</h3>
      <p>Behind the entrance are three rooms. <strong>Explore</strong> is where you learn the IDE itself. <strong>Building the Vibe</strong> is where you meet the team and the ways we work. <strong>AEGIS</strong> — reached through the crystal — is the governing field every project rests within. Each book opens in place; close it and you are exactly where you were.</p>
      <h3>Pause and return</h3>
      <p>You can stop whenever you choose. The intended workflow preserves your application, accepted requirements, progress, and open decisions so you can return without reconstructing everything — so you continue rather than reconstruct. <strong>Pause is always valid.</strong></p>
      <!-- Atlas editorial import: vibe-compass. Source: docs/VIBE_ATLAS_FINAL_COPY.md. - ARID doctrine (Environment Is Everything; Preserved Context); the Ethos ("Pause is always valid"). -->
    </template>

    <template id="content-workspace" data-title="The Workspace">
      <p class="atlas-summary">The open three-dimensional space — the Aether — where your application takes shape.</p>
      <h3>Introduction</h3>
      <p>The Workspace is the open three-dimensional scene, the <strong>Aether</strong>, where your application is built. Your <strong>CORE</strong> sits at its center, and the parts of your app gather and connect around it.</p>
      <h3>A place, not a panel</h3>
      <p>It is wide-open space rather than a wall of toolbars — room to move, look closer, and explore. You inhabit it; you do not merely operate a surface. You build by <strong>assembling and connecting objects</strong>, not by typing code first.</p>
      <h3>Progress you can see</h3>
      <p>As construction happens, the Workspace itself changes: new Elements appear, and connections form between them. Progress is something you <em>watch</em>, not only something you are told. The design aims to make disrupted connections visible too, so you can inspect what needs attention.</p>
      <!-- Atlas editorial import: vibe-workspace. Source: docs/VIBE_ATLAS_FINAL_COPY.md. - `IDE\\\_ORIENTATION` §1–2 (the Aether / `ThreeCanvas`, CORE-centered assembly). "Workspace" is a proper, capitalized name (Architect-confirmed). -->
    </template>

    <template id="content-elements" data-title="The Elements">
      <p class="atlas-summary">What the objects are, how they connect, and how the AEGIS Crystal differs from your app's CORE.</p>
      <h3>Introduction</h3>
      <p>Every object in Vibe Architect means something, and each is <strong>named by what it does</strong>. Learning the Elements is learning how your application is put together.</p>
      <h3>The Crystal and the CORE</h3>
      <p>These two are not the same. The <strong>AEGIS Crystal</strong> is the governing field — the Canon and Ethos every project rests within. The <strong>CORE</strong> is the center of <em>your</em> application: its purpose, scope, and structure. The Crystal holds the CORE the way the ground holds a house.</p>
      <h3>Orbs, Satellites, and the connections between them</h3>
      <p><strong>Orbs</strong> are the primary building blocks — the only Element that docks directly to the CORE, and only through an <strong>Umbilical handshake</strong>. Each Orb carries one self-contained capability (a Library Orb holds documents, a Memory Orb holds state, and so on). <strong>Satellites</strong> tether to a host Orb and add a specialized sub-capability; they come in five classes — Input/Output, Compute, Storage, Validation, and Security — and can mesh with one another to share services. <strong>Portals</strong> are the doorways to services outside your app, reached through the CORE boundary.</p>
      <h3>The Actuators — the ones who act</h3>
      <p>Deeper still are the <strong>Actuators</strong>: the concrete operations that actually do the work, each acting only within the bounded authority of a Work Request. They form a chain by function — <strong>observe</strong> (what exists?), <strong>retrieve</strong> (where is the thing I need?), <strong>assess</strong> (evaluate and classify — it creates understanding; it does not delete), <strong>design</strong> (turn knowledge into a plan), and <strong>build</strong> (the hands that make it). Each hands its work to the next, so what is proposed, what is built, and what is verified stay visibly separate.</p>
      <p>You move through all of this by drilling in — <strong>CORE → Orb → Satellite → Actuator</strong> — and the Wayfinder narrates each step in one plain sentence, so no screen is ever a dead end. Every Element also carries a trust badge (Canonical, Validated, Formulated, Experimental, or Draft), so you always know how settled a piece is.</p>
      <!-- Atlas editorial import: vibe-elements. Source: docs/VIBE_ATLAS_FINAL_COPY.md. - `CORE\\\_ELEMENT\\\_CATALOG` (Orbs/Satellites/Formulas/Portals; five Satellite classes); `IDE\\\_ORIENTATION` §3 (hierarchy, trust badges, socket states). Actuators are written **by function** (Architect-approved), so the copy holds whichever name set ships. -->
    </template>

    <template id="content-luminary" data-title="Meet the Luminary">
      <p class="atlas-summary">Your Peer and Mentor — it shares knowledge and work while your decisions stay yours.</p>
      <h3>Introduction</h3>
      <p>The Luminary travels with you through Vibe Architect. It is both a <strong>Peer</strong> and a <strong>Mentor</strong>: it shares knowledge and technical work while your creative authority stays yours. You decide.</p>
      <h3>Asking questions</h3>
      <p>Ask it anything — what an object means, why a step exists, what happens next. It explains in familiar language, ties each explanation to the objects in front of you, and offers more technical depth whenever you want it. Not knowing the programming words says nothing about how capable you are, and the Luminary works at your pace.</p>
      <h3>Proposals and choices</h3>
      <p>When it suggests something, it tells you plainly whether it is a recommendation or a genuine technical need, and offers real alternatives when they exist. You can accept, decline, reconsider, or explore — and if you decline, it acknowledges that and does not keep steering you back. It evaluates <strong>code</strong>, never you.</p>
      <h3>Honesty, and rest</h3>
      <p>It separates verified facts from assumptions, and names its limits rather than inventing what isn't there. When a reply can't be trusted, the system turns it into a named <strong>Shortfall</strong> rather than letting fallback text pose as an answer. The intended interaction begins <strong>at rest</strong>: the Luminary is available when invited, rather than competing for your attention. At any moment, you can Pause.</p>
      <!-- Atlas editorial import: vibe-luminary. Source: docs/VIBE_ATLAS_FINAL_COPY.md. - `IDE\\\_ORIENTATION` §5–6 (governed partner; Steward's voice; fail-closed Shortfall; server-side gateway with a declared model id). -->
    </template>

    <template id="content-apothecary" data-title="The Apothecary">
      <p class="atlas-summary">The place to create, inspect, and understand Elements up close.</p>
      <h3>Introduction</h3>
      <p>The Apothecary is the library of available Elements and the place where you create, inspect, and understand them up close. You can enter simply because you are curious.</p>
      <h3>Look inside</h3>
      <p>Open an Orb to see its Satellites, experiment with a Satellite, or ask the Luminary how one Actuator works with another. Everything can be taken apart and understood.</p>
      <h3>Learn by doing</h3>
      <p>It is a workshop for learning, not a test. The Luminary can handle the technical construction, which leaves you free to explore how the pieces fit — and to build real things while you are still learning what they are.</p>
      <!-- Atlas editorial import: vibe-apothecary. Source: docs/VIBE_ATLAS_FINAL_COPY.md. - `IDE\\\_ORIENTATION` §3 (the Apothecary as the Element library); drill-down model. -->
    </template>

    <template id="content-first-creation" data-title="Your First Creation">
      <p class="atlas-summary">From an idea in your own words to a working application you can actually use.</p>
      <h3>Introduction</h3>
      <p>You can begin with nothing but an idea, described in your own words, and end with something real you can open and use.</p>
      <h3>How it goes</h3>
      <p>You tell the Luminary what you imagine. Together you shape the design, and <strong>you accept it</strong> — nothing is built until you do. In the guided workflow, the Luminary builds from what you accepted and makes the resulting pieces visible as they take shape.</p>
      <h3>Real, not pretend</h3>
      <p>What you see corresponds to actual functionality — a thumbnail that genuinely opens its picture, a note that genuinely saves. This is the <strong>honest floor</strong>: when something isn't finished, the Luminary says so, rather than showing a hollow result that only looks done. A claim has to trace to something real. As the experience contract puts it: <em>"My imagination can become a functioning application that I can experience and refine."</em></p>
